storyforge: "0"
metadata:
  title: The Lighthouse
  profile: point-and-click
start: harbour
characters:
  anna: {name: Anna}
locations:
  harbour: {name: Harbour}
  lighthouse: {name: Lighthouse}
items:
  rusty_key: {name: Rusty key}
inventory: []
variables:
  door_open: false
scenes:
  harbour:
    text: "Rain sweeps across the harbour. Something glints beside a crate."
    choices:
      - id: take_key
        text: "Pick up the rusty key and walk to the lighthouse"
        commands: ["take key", "take rusty key", "pick up key"]
        action: {type: take, item: rusty_key}
        goto: lighthouse
      - id: walk_lighthouse
        text: "Walk back to the lighthouse"
        requires:
          - {has_item: rusty_key}
        goto: lighthouse
  lighthouse:
    text: "The old lighthouse door stands before you."
    choices:
      - id: unlock_door
        text: "Unlock the door"
        requires:
          - {has_item: rusty_key}
        effects:
          - {variable: door_open, set: true}
        ending: opened
      - {id: return_harbour, text: "Return to the harbour", goto: harbour}
endings:
  opened:
    text: "The rusty lock yields. Darkness waits beyond the door."
