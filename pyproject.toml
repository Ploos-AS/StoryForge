[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge"
version = "0.1.0"
description = "AI-assisted, deterministic toolchain for narrative games"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
storyforge = "storyforge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
storyforge = ["schemas/*.json"]
