name: Release contract

on:
  pull_request:
    paths:
      - pyproject.toml
      - src/storyforge/version.py
      - src/storyforge/cli.py
      - .github/workflows/release-contract.yml
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Verify installed CLI version
        run: |
          python - <<'PY'
          import tomllib, subprocess
          expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          actual = subprocess.check_output(["storyforge", "--version"], text=True).strip()
          assert actual == f"storyforge {expected}", (actual, expected)
          PY
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          expected = "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          actual = os.environ["GITHUB_REF_NAME"]
          assert actual == expected, f"tag {actual!r} != package {expected!r}"
          PY
