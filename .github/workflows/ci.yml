name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: storyforge validate examples/lighthouse/story.yaml
      - run: storyforge export renpy examples/lighthouse/story.yaml -o build/lighthouse/script.rpy
      - run: storyforge init build/new-story --title "CI Story"
      - run: storyforge validate build/new-story/story.yaml
