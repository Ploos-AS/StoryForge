name: OCI

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - src/**
      - .github/workflows/oci.yml
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ploos-as/storyforge
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build qualification image
        run: docker build -t storyforge:qualification .
      - name: CLI starts as packaged
        run: docker run --rm storyforge:qualification --help
      - name: Validate Lighthouse in container
        run: docker run --rm -v "$PWD:/work:ro" storyforge:qualification validate examples/lighthouse/story.yaml
      - name: Solve Lighthouse in container
        run: docker run --rm -v "$PWD:/work:ro" storyforge:qualification solve examples/lighthouse/story.yaml
      - name: Analyze Lighthouse in container
        run: docker run --rm -v "$PWD:/work:ro" storyforge:qualification analyze examples/lighthouse/story.yaml
